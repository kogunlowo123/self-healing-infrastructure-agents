# Syncs service secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates; the audit signing key and
# the Alertmanager webhook credential are created by the security team
# outside Terraform so they never enter Terraform state.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: self-healing-agents-database
  namespace: self-healing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: self-healing-agents-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: self-healing-agents-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: self-healing-agents-audit-key
  namespace: self-healing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: self-healing-agents-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^self-healing-agents-audit-key-"
      rewrite:
        - regexp:
            source: "^self-healing-agents-audit-key-(.*)$"
            target: "audit-$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: self-healing-agents-alertmanager
  namespace: self-healing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: self-healing-agents-alertmanager
    creationPolicy: Owner
  data:
    - secretKey: ALERTMANAGER_TOKEN
      remoteRef:
        key: self-healing-agents-alertmanager-token
---
# The same webhook credential in the namespace where Alertmanager runs
# (referenced by alertmanager-config.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: self-healing-agents-alertmanager
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: self-healing-agents-alertmanager
    creationPolicy: Owner
  data:
    - secretKey: ALERTMANAGER_TOKEN
      remoteRef:
        key: self-healing-agents-alertmanager-token
