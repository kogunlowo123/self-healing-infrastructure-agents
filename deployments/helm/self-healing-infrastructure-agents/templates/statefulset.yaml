{{- /*
StatefulSet so each replica owns a persistent volume for its own signed
audit chain (/var/lib/self-healing-agents/audit/<pod>.jsonl). A log shipper
copies the files to WORM object storage provisioned by Terraform.

The service-account token is not automounted. Two projected tokens are
mounted instead: one for the Kubernetes API (default audience, used by the
remediation executor under the ClusterRole in rbac.yaml) and one with the
identity-fabric audience (exchanged for this agent's own credential).
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "heal.fullname" . }}
  labels: {{- include "heal.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "heal.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "heal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          labelSelector:
            matchLabels: {{- include "heal.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        - name: heal
          image: {{ include "heal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "heal.fullname" . }}
            {{- with .Values.secrets.providers }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEAL_AUDIT_LOG_PATH
              value: /var/lib/self-healing-agents/audit/$(POD_NAME).jsonl
            - name: HEAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database }}
                  key: DATABASE_URL
            - name: HEAL_ALERTMANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.alertmanager }}
                  key: ALERTMANAGER_TOKEN
                  optional: true
            - name: HEAL_FORWARDED_ALLOW_IPS
              value: "*"
            - name: TF_PLUGIN_CACHE_DIR
              value: /var/lib/self-healing-agents/stacks/.plugin-cache
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kubernetes-api
              mountPath: /var/run/secrets/heal/kubernetes
              readOnly: true
            - name: fabric-token
              mountPath: /var/run/secrets/heal/fabric
              readOnly: true
            - name: audit-key
              mountPath: /etc/self-healing-agents/audit-key
              readOnly: true
            - name: audit
              mountPath: /var/lib/self-healing-agents/audit
            - name: stacks
              mountPath: /var/lib/self-healing-agents/stacks
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kubernetes-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: fabric-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  audience: identity-fabric
                  expirationSeconds: 3600
        - name: audit-key
          secret:
            secretName: {{ .Values.secrets.auditKey }}
            defaultMode: 0400
        - name: stacks
          {{- if .Values.terraform.stacksClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.terraform.stacksClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: 1Gi
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: audit
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.audit.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.audit.size }}
