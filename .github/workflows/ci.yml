name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART: deployments/helm/self-healing-infrastructure-agents

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run black --check src tests
      - name: Type check
        run: uv run mypy
      - name: Static security analysis
        run: uv run python -m bandit -q -r src -c pyproject.toml
      - name: Published contracts are current
        run: uv run python -m self_healing_infrastructure_agents.contracts --check
      - name: Unit, security, chaos, performance and e2e tests (coverage gate 90%)
        run: uv run pytest --cov-report=xml
      - name: Dependency vulnerability audit
        if: matrix.python == '3.12'
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes > requirements.audit.txt
          uvx pip-audit -r requirements.audit.txt --strict
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: heal
          POSTGRES_USER: heal
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heal" --health-interval 5s --health-retries 10
    env:
      HEAL_TEST_DATABASE_URL: postgresql+asyncpg://heal:ci-only@localhost:5432/heal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - name: Repository tests against PostgreSQL
        run: uv run pytest tests/integration -m integration --no-cov -ra

  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm lint and render
        run: |
          helm lint "$CHART" -f "$CHART/ci/test-values.yaml"
          helm template heal "$CHART" -f "$CHART/ci/test-values.yaml" > rendered.yaml
          if helm template heal "$CHART" > /dev/null 2>&1; then
            echo "chart rendered without required values"; exit 1
          fi
          if helm template heal "$CHART" -f "$CHART/ci/test-values.yaml" \
               --set heal.fabricUrl= > /dev/null 2>&1; then
            echo "chart rendered without any agent authorization source"; exit 1
          fi
      - name: Kubernetes schema validation (kubeconform)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml deployments/kubernetes/namespace.yaml \
            deployments/kubernetes/external-secrets.yaml deployments/kubernetes/alertmanager-config.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt and validate (aws, azure, gcp)
        run: |
          terraform fmt -recursive -check deployments/terraform
          for cloud in aws azure gcp; do
            terraform -chdir=deployments/terraform/$cloud init -backend=false -input=false
            terraform -chdir=deployments/terraform/$cloud validate
          done
      - name: IaC and Kubernetes misconfiguration scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deployments
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t self-healing-infrastructure-agents:ci .
      - name: Container smoke test (starts, reports ready, serves agent card)
        run: |
          docker run -d --name heal -p 8080:8080 \
            -e HEAL_ENVIRONMENT=ci -e HEAL_DEV_EPHEMERAL_KEYS=true \
            -e HEAL_PUBLIC_URL=http://localhost:8080 \
            -e HEAL_DATABASE_URL=sqlite+aiosqlite:////tmp/heal.db \
            -e HEAL_AUDIT_LOG_PATH=/tmp/audit.jsonl \
            -e HEAL_OPERATOR_ISSUER=https://login.ci.internal \
            -e HEAL_OPERATOR_AUDIENCE=self-healing-agents \
            -e HEAL_OPERATOR_JWKS_URL=https://login.ci.internal/jwks \
            -e HEAL_AGENT_ID=spiffe://agents.ci.internal/agent/platform/self-healer \
            -e HEAL_AGENT_ISSUER=https://identity.ci.internal \
            -e HEAL_AGENT_JWKS_URL=https://identity.ci.internal/jwks \
            self-healing-infrastructure-agents:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/readyz && break; sleep 1
          done
          curl -sf http://localhost:8080/readyz | grep -q '"execution_mode":"dry_run"'
          curl -sf http://localhost:8080/.well-known/agent-card.json | grep -q 'Self-Healing Infrastructure Agent'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/incidents)" = "401"
          docker exec heal terraform version
          docker inspect --format '{{.Config.User}}' self-healing-infrastructure-agents:ci | grep -q 10001
          docker logs heal
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: self-healing-infrastructure-agents:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Image SBOM (Syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: self-healing-infrastructure-agents:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: SBOM vulnerability gate (Grype)
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/secrets --config p/dockerfile --error --metrics=off src Dockerfile
