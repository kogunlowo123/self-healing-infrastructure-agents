name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/self-healing-infrastructure-agents
  CHART: deployments/helm/self-healing-infrastructure-agents

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - name: Quality gate
        run: |
          uv run ruff check src tests
          uv run black --check src tests
          uv run mypy
          uv run python -m bandit -q -r src -c pyproject.toml
          uv run python -m self_healing_infrastructure_agents.contracts --check
          uv run pytest
      - name: Tag matches versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(uv run python -c 'import self_healing_infrastructure_agents as m; print(m.__version__)')" = "$version"
          grep -q "^appVersion: \"$version\"" "$CHART/Chart.yaml"
          grep -q "^version: $version" "$CHART/Chart.yaml"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Image provenance attestation
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Package and push Helm chart
        run: |
          helm package "$CHART" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/self-healing-infrastructure-agents-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: SBOM for release
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Image: ${IMAGE}@${{ steps.push.outputs.digest }}" > dist/IMAGE
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
